name: build-linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'server*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Build
        working-directory: server
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o spiritfruit ./main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spiritfruit
          path: server/spiritfruit